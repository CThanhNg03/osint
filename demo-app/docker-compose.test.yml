version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend-test:
    build: ./backend
    command: ["pytest", "-q"]
    environment:
      - DATABASE_URL=sqlite:///./test.db
      - REDIS_URL=redis://redis:6379/0
      - IMAGE_STORE_PATH=/tmp/images
      - PERSON_SERVICE_PORT=8001
      - TEST_MODE=1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
