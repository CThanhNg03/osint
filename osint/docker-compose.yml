version: "3.9"

services:
  backend:
    image: osint-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@postgres:5432/mediamonitor}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:11434/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-ollama}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-please-change-me}
      PERSON_SERVICE_URL: ${PERSON_SERVICE_URL:-http://person-service:8001}
    depends_on:
      - postgres
      - redis
      - embedding
      - neo4j
      - person-service
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/monitor}
        VITE_NEO4J_URI: ${VITE_NEO4J_URI:-bolt://localhost:7687}
        VITE_NEO4J_USER: ${VITE_NEO4J_USER:-neo4j}
        VITE_NEO4J_PASSWORD: ${VITE_NEO4J_PASSWORD:-please-change-me}
        VITE_PERSON_API_URL: ${VITE_PERSON_API_URL:-http://localhost:8001}
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  ingestor:
    image: osint-backend
    command: ["python", "ingestor_service.py"]
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    restart: unless-stopped

  person-service:
    image: osint-backend
    command: ["python", "person_service.py"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@postgres:5432/mediamonitor}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      IMAGE_STORE_PATH: ${IMAGE_STORE_PATH:-/data/images}
      PERSON_SERVICE_PORT: ${PERSON_SERVICE_PORT:-8001}
    depends_on:
      - postgres
      - redis
    volumes:
      - person_images:/data/images
    ports:
      - "8001:8001"
    restart: unless-stopped

  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mediamonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5.22
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please-change-me}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  embedding:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve

volumes:
  backend_data:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  person_images:
